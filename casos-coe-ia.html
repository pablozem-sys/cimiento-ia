<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casos de Uso · CoE IA · Cimiento IA</title>
<style>
  :root {
    --bg: #1A1C20;
    --card: #22252b;
    --stripe: #D2232A;
    --hormigones: #16C5D6;
    --cemento: #D2232A;
    --aridos: #E0982A;
    --corporativo: #2BA86F;
    --text: #f0ede8;
    --text-2: #8a8580;
    --border: rgba(255,255,255,0.07);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-left: 14px;
  }

  .franja {
    position: fixed;
    top: 0;
    left: 0;
    width: 14px;
    height: 100vh;
    background: var(--stripe);
    z-index: 100;
  }

  /* ── Header ─────────────────────────────────────────────── */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.01em;
  }

  .logo-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--stripe);
    flex-shrink: 0;
  }

  .logo .ia {
    color: var(--hormigones);
  }

  /* ── Layout general ─────────────────────────────────────── */
  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 32px 32px 80px;
  }

  .page-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }

  .page-subtitle {
    color: var(--text-2);
    font-size: 14.5px;
    margin: 0 0 28px;
  }

  /* ── KPIs ───────────────────────────────────────────────── */
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }

  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }

  .kpi-value {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 6px;
  }

  .kpi-label {
    font-size: 12.5px;
    color: var(--text-2);
    font-weight: 500;
  }

  /* ── Gráficos ───────────────────────────────────────────── */
  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 28px;
  }

  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
  }

  .chart-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0 0 18px;
  }

  .bar-row {
    display: grid;
    grid-template-columns: 110px 1fr 32px;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }

  .bar-row:last-child { margin-bottom: 0; }

  .bar-label {
    font-size: 12.5px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bar-track {
    height: 9px;
    background: rgba(255,255,255,0.06);
    border-radius: 5px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 5px;
    transition: width .5s ease;
  }

  .bar-count {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-2);
    text-align: right;
  }

  /* ── Filtros ────────────────────────────────────────────── */
  .filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .pill {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text-2);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 16px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s ease;
    font-family: inherit;
  }

  .pill:hover {
    color: var(--text);
    border-color: rgba(255,255,255,0.15);
  }

  .pill.activo {
    color: #fff;
    border-color: transparent;
  }

  /* ── Grid de tarjetas ───────────────────────────────────── */
  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .caso-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid transparent;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: transform .15s ease, border-color .15s ease;
  }

  .caso-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,0.16);
  }

  .caso-card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .caso-titulo {
    font-size: 15.5px;
    font-weight: 700;
    line-height: 1.35;
    margin: 0;
  }

  .badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }

  .badge-alto { background: rgba(210,35,42,0.16); color: #ff7b81; }
  .badge-medio { background: rgba(224,152,42,0.16); color: #f2b464; }

  .caso-desc {
    font-size: 13.5px;
    color: var(--text-2);
    line-height: 1.5;
    margin: 0 0 14px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .caso-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
  }

  .tag {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    color: var(--text-2);
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .caso-footer {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-2);
  }

  /* ── Modal ──────────────────────────────────────────────── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,11,13,0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .overlay.abierto { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 620px;
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    position: relative;
  }

  .modal-color-bar {
    height: 6px;
    border-radius: 16px 16px 0 0;
  }

  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.06);
    border: none;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .modal-close:hover { background: rgba(255,255,255,0.12); }

  .modal-body { padding: 28px 30px 30px; }

  .modal-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .modal-titulo {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.3;
    margin: 0 0 20px;
  }

  .modal-section { margin-bottom: 20px; }

  .modal-section-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-2);
    margin: 0 0 6px;
  }

  .modal-section-text {
    font-size: 14px;
    line-height: 1.6;
    margin: 0;
  }

  .modal-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
    padding: 16px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
  }

  .modal-grid-item .modal-section-label { margin-bottom: 4px; }
  .modal-grid-item .modal-section-text { font-size: 13.5px; }

  .modal-piloto {
    background: rgba(22,197,214,0.08);
    border: 1px solid rgba(22,197,214,0.18);
    border-radius: 10px;
    padding: 16px;
  }

  .modal-piloto .modal-section-label { color: var(--hormigones); }

  /* ── Responsive ─────────────────────────────────────────── */
  @media (max-width: 860px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .charts { grid-template-columns: 1fr; }
    .cards-grid { grid-template-columns: 1fr; }
    .modal-grid { grid-template-columns: 1fr; }
    header { padding: 14px 18px; }
    main { padding: 24px 18px 60px; }
  }
</style>
</head>

</div>

function listaCasos() {
  return Object.keys(datos).map(function (k) { return { id: k, c: datos[k] }; });
}

function renderKpis() {
  var casos = listaCasos();
  var total = casos.length;
  var impactoAlto = casos.filter(function (x) { return x.c.impacto === "Alto"; }).length;
  var urgenciaAltaMedia = casos.filter(function (x) { return x.c.urgencia === "Alta" || x.c.urgencia === "Media"; }).length;
  var areas = {};
  casos.forEach(function (x) { areas[x.c.area] = true; });
  var numAreas = Object.keys(areas).length;

  var items = [
    { valor: total, label: "Casos levantados", color: "#16C5D6" },
    { valor: impactoAlto, label: "Casos de impacto alto", color: "#D2232A" },
    { valor: urgenciaAltaMedia, label: "Urgencia alta o media", color: "#2BA86F" },
    { valor: numAreas, label: "Áreas representadas", color: "#E0982A" }
  ];

  var html = items.map(function (it) {
    return '<div class="kpi-card">' +
      '<div class="kpi-value" style="color:' + it.color + '">' + it.valor + '</div>' +
      '<div class="kpi-label">' + it.label + '</div>' +
    '</div>';
  }).join('');

  document.getElementById('kpis').innerHTML = html;
}

function renderChart(targetId, entries) {
  var max = Math.max.apply(null, entries.map(function (e) { return e.count; }).concat([1]));
  var html = entries
    .sort(function (a, b) { return b.count - a.count; })
    .map(function (e) {
      var pct = Math.round((e.count / max) * 100);
      return '<div class="bar-row">' +
        '<span class="bar-label">' + e.label + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + e.color + '"></div></div>' +
        '<span class="bar-count">' + e.count + '</span>' +
      '</div>';
    }).join('');
  document.getElementById(targetId).innerHTML = html;
}

function renderCharts() {
  var casos = listaCasos();

  var porArea = {};
  casos.forEach(function (x) {
    porArea[x.c.area] = (porArea[x.c.area] || 0) + 1;
  });
  renderChart('chart-area', Object.keys(porArea).map(function (a) {
    return { label: a, count: porArea[a], color: AREA_COLOR[a] || '#8a8580' };
  }));

  var porValor = {};
  casos.forEach(function (x) {
    x.c.valor.split('·').forEach(function (v) {
      v = v.trim();
      if (!v) return;
      porValor[v] = (porValor[v] || 0) + 1;
    });
  });
  renderChart('chart-valor', Object.keys(porValor).map(function (v) {
    return { label: v, count: porValor[v], color: '#16C5D6' };
  }));
}

function renderCards(filtroArea) {
  filtroArea = filtroArea || 'Todos';
  var casos = listaCasos().filter(function (x) {
    return filtroArea === 'Todos' || x.c.area === filtroArea;
  });

  var html = casos.map(function (x) {
    var c = x.c;
    var badgeClass = c.impacto === 'Alto' ? 'badge-alto' : 'badge-medio';
    return '<div class="caso-card" style="border-left-color:' + c.color + '" onclick="abrirModal(\'' + x.id + '\')">' +
      '<div class="caso-card-top">' +
        '<h3 class="caso-titulo">' + c.titulo + '</h3>' +
        '<span class="badge ' + badgeClass + '">' + c.impacto + '</span>' +
      '</div>' +
      '<p class="caso-desc">' + c.problema + '</p>' +
      '<div class="caso-tags">' +
        '<span class="tag" style="color:' + c.color + '">' + c.area + '</span>' +
        (c.beneficio ? '<span class="tag">' + c.beneficio + '</span>' : '') +
        '<span class="tag">Urgencia ' + c.urgencia + '</span>' +
      '</div>' +
      '<div class="caso-footer">' +
        '<span>Caso Nº ' + x.id + '</span>' +
      '</div>' +
    '</div>';
  }).join('');

  document.getElementById('cards-grid').innerHTML = html || '<p style="color:var(--text-2)">Sin casos para esta área todavía.</p>';
}

function abrirModal(id) {
  var c = datos[id];
  if (!c) return;

  document.getElementById('modal-color-bar').style.background = c.color;
  document.getElementById('modal-titulo').textContent = c.titulo;
  document.getElementById('modal-problema').textContent = c.problema;
  document.getElementById('modal-resultado').textContent = c.resultado;
  document.getElementById('modal-beneficio').textContent = c.beneficio;
  document.getElementById('modal-beneficio').closest('.modal-grid-item').style.display = c.beneficio ? '' : 'none';
  document.getElementById('modal-valor').textContent = c.valor;
  document.getElementById('modal-datos').textContent = c.datos;
  document.getElementById('modal-piloto').textContent = c.piloto;

  var badgeImpacto = c.impacto === 'Alto' ? 'badge-alto' : 'badge-medio';
  var badgeUrgencia = c.urgencia === 'Alta' ? 'badge-alto' : 'badge-medio';
  document.getElementById('modal-badges').innerHTML =
    '<span class="tag" style="color:' + c.color + '">' + c.area + '</span>' +
    '<span class="badge ' + badgeImpacto + '">Impacto ' + c.impacto + '</span>' +
    '<span class="badge ' + badgeUrgencia + '">Urgencia ' + c.urgencia + '</span>';

  document.getElementById('overlay').classList.add('abierto');
}

function cerrarModal(e) {
  if (e.target.id === 'overlay' || e.target.classList.contains('modal-close') || e.currentTarget.classList.contains('modal-close')) {
    document.getElementById('overlay').classList.remove('abierto');
  }
}

function filtrar(area, btn) {
  document.querySelectorAll('.pill').forEach(function (p) {
    p.classList.remove('activo');
    p.style.background = '';
    p.style.borderColor = '';
    p.style.color = '';
  });
  btn.classList.add('activo');
  if (area !== 'Todos') {
    var color = AREA_COLOR[area];
    btn.style.background = color;
    btn.style.borderColor = color;
    btn.style.color = '#0a0b0d';
  }
  renderCards(area);
}

renderKpis();
renderCharts();
renderCards('Todos');
</script>

</body>
</html>
